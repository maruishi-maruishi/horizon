[package]
name = "horizon-wasm-plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly plugins for Horizon servers: hot-reloaded, sandboxed, on every native hook"
publish = false

[[bin]]
name = "horizon-plugin-server"
path = "src/main.rs"

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-threads = { path = "../horizon-threads" }
horizon-mods = { path = "../horizon-mods" }
horizon-protocol = { path = "../horizon-protocol" }
ureq = { version = "2", default-features = false, features = ["tls"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
log = "0.4"

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
syn = { version = "2", features = ["full"] }
quote = "1"
winresource = "0.1"

[lints]
workspace = true
